name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  DEFAULT_AI_PROVIDER: mock
  EMBEDDING_PROVIDER: mock
  ENVIRONMENT: test
PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/apps/api
jobs:
  engine:
    name: Engine + cadence (no database)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet pytest pytest-asyncio
      - env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/apps/api
        run: python -m pytest apps/api/tests/test_workflow_engine.py apps/api/tests/test_schedule.py -q

  api:
    name: API suite (PostgreSQL 16 + pgvector)
    runs-on: ubuntu-latest
    needs: engine
    services:
      postgres:
        # pgvector's own image; the stock postgres image lacks the extension
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meta_supreme
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/meta_supreme
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/meta_supreme_test
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r apps/api/requirements.txt
          python -m pip install --quiet ruff pytest pytest-asyncio httpx asyncpg alembic
      - run: alembic upgrade head
      # A rollback nobody exercises is a rollback that does not work
      - run: |
          alembic downgrade 001_baseline
          alembic upgrade head
      - run: python -m pytest apps/api/tests -q --tb=short
      - run: ruff check .
