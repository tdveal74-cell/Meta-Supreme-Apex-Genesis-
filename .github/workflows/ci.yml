name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  DEFAULT_AI_PROVIDER: mock
  EMBEDDING_PROVIDER: mock
  ENVIRONMENT: test
  PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/apps/api

jobs:
  standalone:
    name: Standalone offline flagship (canonical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt
      # The whole zero-infrastructure suite, named file by file. This ran only
      # test_billing and test_definition — 12 of the 74 tests that need no
      # database — while nine other files could not even be imported, so CI was
      # green over a suite that mostly did not run.
      # `make standalone` is the documented zero-infrastructure entry point, and
      # nothing imported it, so moving a module out of the flat layout broke it
      # silently. Importing it here is the cheapest way to keep that honest.
      - name: The documented offline entry point still imports
        run: python -c "import standalone_api; print(standalone_api.app.title)"
      - name: Offline suite (no database, no keys)
        run: |
          python -m pytest -q --tb=short \
            test_billing.py \
            test_definition.py \
            test_providers.py \
            test_schedule.py \
            test_workflow_engine.py

  engine:
    name: Engine + cadence (no database)
    runs-on: ubuntu-latest
    needs: standalone
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The declared dependency set, not a hand-picked subset. Naming packages
      # one at a time meant every test added to this job failed first on an
      # import — pydantic-settings, then httpx — rather than on anything the
      # test asserts. requirements.txt is what this code says it needs.
      - run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt
      # These guarded on apps/api/tests, which has never existed in this repo,
      # so the job printed a reassuring message and passed without running a
      # test. A guard whose false branch always wins is not a guard.
      - name: Council and security (no database)
        run: |
          if [ ! -f services/agents/executor.py ]; then
            echo "::error::services/agents/executor.py is absent — it blocks test_council.py and test_phase4_council.py. See RESTORE.md."
            exit 1
          fi
          # The two stream tests drive the endpoint through a real database, so
          # they belong to the `api` job, which provisions one and runs the whole
          # suite. Named individually rather than filtered by keyword: a `-k`
          # pattern would silently widen as tests are added.
          python -m pytest test_council.py test_phase4_council.py test_security.py \
            -q --tb=short \
            --deselect test_phase4_council.py::test_stream_endpoint_emits_events_and_persists \
            --deselect test_phase4_council.py::test_stream_endpoint_reports_errors_as_events

  api:
    name: API suite (PostgreSQL 16 + pgvector)
    runs-on: ubuntu-latest
    needs: engine
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meta_supreme
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/meta_supreme
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/meta_supreme_test
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt

      - name: The test fixture's schema and deploy migrations are present
        run: |
          for f in 001_initial_schema 002_workflow_runs 003_schedule_dispatch 004_federated_knowledge_waist 005_agent_runtime_persistence 006_devon_approval_store; do
            test -s "database/schemas/$f.sql" || { echo "::error::database/schemas/$f.sql is missing or empty"; exit 1; }
          done
          for f in 005_agent_runtime_persistence 006_devon_approval_store; do
            test -s "database/migrations/versions/$f.py" || { echo "::error::database/migrations/versions/$f.py is missing or empty"; exit 1; }
          done

      - name: Full suite (PostgreSQL)
        shell: bash -eo pipefail {0}
        run: python -m pytest -q --tb=short 2>&1 | tee pytest.out

      - name: Fresh Alembic deploy reaches shared approval head
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/meta_supreme
        run: |
          alembic upgrade head
          alembic downgrade 004_federated_knowledge_waist
          alembic upgrade head
          python - <<'PY'
          import asyncio
          import asyncpg

          async def main():
              conn = await asyncpg.connect(
                  "postgresql://postgres:postgres@localhost:5432/meta_supreme"
              )
              try:
                  expected = {
                      "agent_tasks",
                      "agent_task_checkpoints",
                      "agent_runtime_memories",
                      "agent_runtime_skills",
                      "devon_approvals",
                  }
                  rows = await conn.fetch(
                      "SELECT table_name FROM information_schema.tables "
                      "WHERE table_schema = 'public' AND table_name = ANY($1::text[])",
                      list(expected),
                  )
                  present = {row["table_name"] for row in rows}
                  missing = expected - present
                  assert not missing, f"missing migrated tables: {sorted(missing)}"
                  revision = await conn.fetchval("SELECT version_num FROM alembic_version")
                  assert revision == "006_devon_approval_store", revision
              finally:
                  await conn.close()

          asyncio.run(main())
          PY

      - name: Failure summary
        if: failure()
        run: |
          for f in pytest.out; do
            [ -f "$f" ] || continue
            echo "=== $f (last 40) ==="
            tail -40 "$f"
          done

      - name: Lint
        run: ruff check .
