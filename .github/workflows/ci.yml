name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  DEFAULT_AI_PROVIDER: mock
  EMBEDDING_PROVIDER: mock
  ENVIRONMENT: test
  PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/apps/api

jobs:
  standalone:
    name: Standalone offline flagship (canonical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt
      - name: The documented offline entry point still imports
        run: python -c "import standalone_api; print(standalone_api.app.title)"
      # n8n Cloud runs these Code node bodies; this repo is where they are read
      # and diffed. Nothing executed them until 2026-09-06, when a gauntlet
      # found a regex in parse_draft.js that silently merged lines in every
      # draft DEVON writes, on a commit where all six jobs were green. A parse
      # check is not a behaviour test, but a syntax error or an unclosed class
      # can no longer reach the estate with CI reporting success.
      - name: The n8n Code node sources parse
        run: |
          shopt -s globstar nullglob
          files=(n8n/**/*.js)
          if [ ${#files[@]} -eq 0 ]; then echo "no n8n sources found, refusing to pass silently"; exit 1; fi
          for f in "${files[@]}"; do echo "checking $f"; node --check "$f"; done
          echo "${#files[@]} file(s) parsed"
      # And here is one behaviour test, for the node whose rule was wrong rather
      # than unparseable. The Pulse called a COMPLETED job "unfed" after forty
      # minutes while the feeder that carries it runs once a day, so on
      # 2026-09-16 the 04:00:15Z beat reported a feeder that was armed and
      # simply not due; the same rule could not see a feeder that died on a
      # quiet week. The harness drives the real node body over the real rows of
      # that morning, and asserts the retired rule fired where the new one is
      # silent, so this is measured against what it replaced rather than
      # asserted.
      - name: The Pulse's feeder findings behave
        run: node n8n/devon/heartbeat/compose_pulse.test.mjs
      # The Drive Draft Writer left an empty Google Doc on 2026-10-22 and recorded
      # it as the draft on the 2026-10-23T00:00Z retry, job
      # 01M5JVGEDWVYFKWQ28T3N71QW2. The harness drives the real
      # node bodies over that job's real second pass and asserts the retired
      # adoption rule took the blank file where the new one refuses it.
      - name: The draft writer never records a blank Doc as a draft
        run: node n8n/devon/drive-draft-writer/drive_draft.test.mjs
      # Two more, for the stage that puts sources on a TQO row and the gate that
      # holds the writer to them, ruled by Tee 2026-10-07 after row 46. Both
      # drive the real node bodies over sentences from executions 2349 to 2351.
      - name: TQO Research keeps only quotes that are on the page
        run: node n8n/tqo-research/research.test.mjs
      - name: The Sources Gate refuses figures the sources do not hold
        run: node n8n/tqo-v5/sources_gate.test.mjs
      - name: The length check after the doctor adds words and nothing else
        run: node n8n/tqo-v5/length_after_doctor.test.mjs
      # TQO-only Slop Curator preflight (staged, offline and no publishing).
      # Holds at 89, requires the final text hash, and never alters TSWS or NCO.
      - name: TQO Slop Curator holds on stale evidence and scores under 90
        run: node --test n8n/tqo-v5/slop-curator/tqo_curator_gate.test.mjs
      - name: Universal 90 quality threshold scales without rounding up
        run: node --test n8n/tqo-v5/slop-curator/scaled_acceptance_floor.test.mjs
      - name: DEVON isolated universal 90 verifier holds without independent proof
        run: node --test n8n/tqo-v5/slop-curator/devon_isolated_verifier.test.mjs
      - name: Universal 90 continuity transformer rejects drift and unsafe replacements
        run: node --test n8n/tqo-v5/slop-curator/live_universal90_continuity_candidate.test.mjs
      - name: DEVON isolated stage installer parses without running production changes
        run: bash -n deploy/quality90/install-isolated-stage.sh
      - name: TQO 90-point V5 candidate preserves NCO and pinned export
        run: node --test n8n/tqo-v5/slop-curator/tqo90_workflow_candidate.test.mjs
      - name: TQO ChatGPT review handoff validates signatures and final-text binding
        run: node --test n8n/tqo-v5/slop-curator/chatgpt_review_handoff.test.mjs
      - name: TQO private review CLI never logs script or secrets
        run: node --test n8n/tqo-v5/slop-curator/review_handoff_cli.test.mjs
      - name: Universal 90 quality gate covers every brand, evidence and canon
        run: node --test n8n/tqo-v5/slop-curator/ecosystem_review_gate.test.mjs
      - name: External public-key receipt verification remains independent
        run: node --test n8n/tqo-v5/slop-curator/public_key_review_verifier.test.mjs
      - name: Universal 90 live-export drift guard refuses stale source
        run: node --test n8n/tqo-v5/slop-curator/live_v5_universal90_candidate.test.mjs
      - name: Live-capture 89/90 no-spend smoke harness parses
        run: node --check n8n/tqo-v5/slop-curator/live_v5_offline_smoke.mjs
      - name: DEVON live bot QC 90 capture refuses source drift
        run: node --test n8n/tqo-v5/slop-curator/live_devon_bot_universal90_candidate.test.mjs
      - name: DEVON bot 90 no-spend host smoke harness parses
        run: node --check n8n/tqo-v5/slop-curator/live_devon_bot_universal90_smoke.mjs
      # The Jev image lanes, ruled by Tee 2026-10-16, ship in shadow and are not
      # wired yet. Each harness drives the real node bodies against stubs and
      # against the unmodified export code; none of them calls TypeSafe, so a
      # pass says nothing about Jev's judgment or the live API.
      - name: The Jev b-roll stills follow Build Movie's candidate rule
        run: node n8n/tqo-v5/jev_broll_bodies.test.mjs
      - name: Build Movie keeps today's clips while Jev only reports
        run: node n8n/tqo-v5/build_movie.test.mjs
      - name: Pick Still keeps today's photo while Jev only reports
        run: node n8n/tqo-v5/jev_thumb_rank.test.mjs
      - name: The thumbnail check adds no note while Jev only reports
        run: node n8n/tqo-v5/jev_thumb_check.test.mjs
      - name: The Jev lanes hold together across their nodes
        run: node n8n/tqo-v5/jev_lanes_chain.test.mjs
      # Published 2026-10-27 as 3db61aef on Tee's card. The repo bodies must be
      # the ones that version runs, in shadow, with the model pinned.
      - name: The published Jev lanes run the repo bodies
        run: node n8n/tqo-v5/live-jev-lanes/jev_live_lanes.test.mjs
      # Ruled by Tee 2026-10-27 on two cards and published as de4ac645: the
      # thumbnail panel drawn 85 percent opaque, and every headline line inside it.
      - name: The thumbnail panel is opaque and the headline fits inside it
        run: node n8n/tqo-v5/live-thumb-layout/thumb_layout.test.mjs
      # Ruled by Tee 2026-10-17: the disclosure and title laws OS 28 never ran,
      # and the Doctor Gate that held every row. Pinned to the live export.
      - name: OS 28 enforces the disclosure and title laws, and the Doctor Gate can clear
        run: node n8n/tqo-v5/compliance/compliance.test.mjs
      # Ruled by Tee 2026-10-24: #367 rebuilt on the live version dd734ea2,
      # which was re-imported without it, keeping the Quality90 layer.
      - name: The #367 laws rebuilt on the live workflow, Quality90 untouched
        run: node n8n/tqo-v5/compliance/rebuild/rebuild.test.mjs
      # Ruled by Tee 2026-10-24, "Score only, never rewrite": the hand-run
      # doctor for the Scripted rows the live doctor never reached.
      - name: The score-only script doctor writes a line and nothing else
        run: node n8n/tqo-v5/doctor-score-only/score_only.test.mjs
      # Ruled by Tee 2026-10-24, "Draft and publish": the live Hydrate reads the
      # row's own columns, published as bdb59b09.
      - name: The live Hydrate fix is the one line it says it is
        run: node n8n/tqo-v5/live-hydrate-fix/hydrate_fix.test.mjs
      # Ruled by Tee 2026-10-24, "Same wording, draft and publish": with no
      # checklist stored, the live doctor judges the spoken steps.
      - name: The live doctor checklist fix is the one text it says it is
        run: node n8n/tqo-v5/live-doctor-checklist-fix/checklist_fix.test.mjs
      # Ruled by Tee 2026-10-25, "Both shows, live too", "Allow a comments
      # question" and "Keep NCO's subscribe close": the live doctor gets the
      # score-only grounding and NCO's comments question and subscribe close
      # sentence.
      - name: The live doctor grounding is the score-only grounding
        run: node n8n/tqo-v5/live-doctor-grounding/grounding.test.mjs
      # Ruled by Tee 2026-10-26, "Fill and parse": Hydrate reads a checklist
      # stored as JSON text, in the live lane and the score-only lane alike.
      - name: The live Hydrate reads a stored checklist
        run: node n8n/tqo-v5/live-checklist-parse/checklist_parse.test.mjs
      # Ruled by Tee 2026-10-26, "Add it in Fill Run Fields": the TQO
      # description carries the episode's steps, as the writer is told.
      - name: The TQO description carries the checklist
        run: node n8n/tqo-v5/live-description-checklist/description_checklist.test.mjs
      # Ruled by Tee 2026-10-26, "Move it next to the rules": the NCO bait and
      # close 15 rubric lines each allow one specific comments question.
      - name: The NCO rubric lines allow a comments question
        run: node n8n/tqo-v5/live-nco-close-rubric/nco_rubric.test.mjs
      # The carousel rules, ruled by Tee 2026-10-07. No browser here: the drawing
      # runs in carousel-render.yml.
      - name: The carousel rules behave
        run: node tools/carousel/carousel.test.mjs
      # The learning lane grouping build, ruled by Tee 2026-10-08. The rule block
      # decides which completed jobs count as independent evidence for a lesson,
      # driven over the real 2026-09-16 ledger row; the gate test drives the
      # gate's own node bodies over the claim of every POST the feeder has ever
      # made, and over one POST the feeder's own code builds from that real row,
      # and hands the answer to the feeder's own Log Or Alert node.
      - name: The lesson grouping rules count only independent, human verified jobs
        run: node n8n/devon/learning/lesson_evidence.test.mjs
      - name: The Learning Gate refuses before it searches and promotes only what it verified
        run: node n8n/devon/learning-gate/gate.test.mjs
      # Phase 2 of the same build, ruled by Tee 2026-10-11: the Soul Committer
      # cards a lesson only, quoting each member job's own ledger row (the real
      # 2026-09-16 row among them), refuses for good what it cannot card, and
      # writes the record to_record describes.
      - name: The Soul Committer cards only lessons and writes what Tee approved
        run: node n8n/devon/soul-committer/committer.test.mjs
      - name: Offline suite (no database, no keys)
        run: |
          python -m pytest -q --tb=short \
            test_devon_rsi.py \
            test_devon_rsi_ops.py \
            test_devon_rsi_experiments.py \
            test_agent_evaluation.py \
            test_agent_benchmarks.py \
            test_runtime_verification.py \
            test_skill_evaluation_policy.py \
            test_billing.py \
            test_definition.py \
            test_providers.py \
            test_schedule.py \
            test_workflow_engine.py \
            test_devon_hermes_expansion.py \
            test_devon_hermes_durable_followon.py \
            test_devon_learning_loop.py \
            test_devon_operating_layer.py \
            test_devon_editforge_execution.py \
            test_devon_data_tables.py \
            test_devon_table_id_conversion.py \
            test_devon_provider_billing.py \
            test_devon_spoken_input.py \
            test_devon_hermes_surface.py \
            test_devon_receipts.py \
            test_devon_capture_enrichment.py \
            test_presence_cartesia.py \
            test_presence_service.py \
            test_presence_hearing.py \
            test_presence_livekit_publisher.py \
            test_devon_owned_voice.py \
            test_devon_learning_context_honesty.py \
            test_knowledge_graph.py \
            test_knowledge_graph_fixtures.py \
            test_devon_scheduler_honesty.py \
            test_devon_scheduler_report_honesty.py \
            test_devon_console_voice_honesty.py \
            test_n8n_telemetry.py \
            test_devon_vision_path.py \
            test_devon_vision_fixture.py \
            test_pulse_watchdog.py \
            test_devon_rule_ledger.py \
            test_devon_wager.py \
            test_devon_tqo_canon.py \
            test_provider_watchdog.py \
            test_devon_show_registry.py \
            test_show_registry_seed.py \
            test_devon_lesson_registry.py \
            test_gate_ledger.py \
            test_jev_route.py \
            test_ledger_receipt.py \
            test_code_worker.py \
            test_watch_long.py \
            test_mpt_shorts.py \
            test_openmontage_installer.py test_ltx_build_graph.py

  dependency-audit:
    name: Dependency audit (pip-audit + pnpm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The interpreter Dockerfile.api ships, so the audit resolves the
          # same set Railway builds.
          python-version: "3.12"
      - name: Install pip-audit
        id: install-pip-audit
        run: python -m pip install --quiet --upgrade pip pip-audit
      # PYSEC-2026-1325 was ecdsa, pulled in by python-jose, which the
      # ecdsa maintainers said they would not fix. Audit item 16 replaced
      # python-jose with PyJWT in app/security/jwt.py, which removed
      # ecdsa from the resolved set along with it, so the ignore is gone
      # too: a fresh advisory here should fail the build, not sit hidden
      # behind a stale id. Two resolutions on purpose: audited together,
      # the root pins would override the soul host's floating versions
      # and hide a newer vulnerable release the soul host would actually
      # install. --strict fails the audit on a dependency it could not
      # check (one not on PyPI), which otherwise prints a skip and exits 0.
      #
      # Each audit after the first runs even when an earlier one is red,
      # so an advisory left open in one file cannot hide a newer one in
      # another. Found by the 2026-10-31 critic of dependency-audit-daily.yml,
      # which runs these same steps every day.
      - name: pip-audit the pinned requirements
        run: python -m pip_audit --strict -r requirements.txt --progress-spinner off
      - name: pip-audit the soul host's requirements
        if: ${{ !cancelled() && steps.install-pip-audit.outcome == 'success' }}
        run: python -m pip_audit --strict -r deploy/soul/requirements.txt --progress-spinner off
      - uses: pnpm/action-setup@v4
        if: ${{ !cancelled() }}
        with:
          version: 10
      # No `cache: pnpm` here: the audit reads the lockfile and installs
      # nothing, so setup-node's post-step has no store to save and fails
      # the job with "Path Validation Error" when the option is set.
      - uses: actions/setup-node@v4
        if: ${{ !cancelled() }}
        with:
          node-version: "22"
      - name: pnpm audit the locked workspace
        if: ${{ !cancelled() }}
        run: pnpm audit --audit-level=moderate

  container:
    name: Railway container contract
    runs-on: ubuntu-latest
    needs: standalone
    steps:
      - uses: actions/checkout@v4
      - name: Build the production API image
        run: docker build -f infrastructure/docker/Dockerfile.api -t devon-api-ci .
      - name: Image imports canonical DEVON, passkeys, and Cerebras
        run: |
          docker run --rm --entrypoint python \
            -e DEFAULT_AI_PROVIDER=mock \
            devon-api-ci -c "from app.main import app; from app.api.v1.auth import passkey_login_options; from services.intelligence.providers.cerebras_provider import CerebrasProvider; print(app.title, passkey_login_options.__name__, CerebrasProvider.name)"
      # Tee ruled on 2026-10-31 that Railway builds api and scheduler-cron from
      # this Dockerfile. Under Railpack, which copies the whole repository, a
      # file the API reads at runtime and this image does not copy broke
      # nothing; under this Dockerfile it breaks the route that reads it. The
      # reliability shadow route reads policies/ per request, and
      # scheduler-cron runs dispatch.py. Which builder a service uses is a
      # Railway setting: read it from get-service-config.
      - name: Image carries the reliability policy file and the dispatcher
        run: |
          docker run --rm --entrypoint python \
            -e DEFAULT_AI_PROVIDER=mock \
            devon-api-ci -c "from app.api.v1.arf_shadow import _POLICY_PATH; assert _POLICY_PATH.is_file(), _POLICY_PATH; import dispatch; print(_POLICY_PATH, dispatch.__name__)"

  engine:
    name: Engine + cadence (no database)
    runs-on: ubuntu-latest
    needs: standalone
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt
      - name: Council and security (no database)
        run: |
          if [ ! -f services/agents/executor.py ]; then
            echo "::error::services/agents/executor.py is absent, and it blocks test_council.py and test_phase4_council.py. See RESTORE.md."
            exit 1
          fi
          python -m pytest test_council.py test_phase4_council.py test_security.py \
            -q --tb=short \
            --deselect test_phase4_council.py::test_stream_endpoint_emits_events_and_persists \
            --deselect test_phase4_council.py::test_stream_endpoint_reports_errors_as_events

  api:
    name: API suite (PostgreSQL 16 + pgvector)
    runs-on: ubuntu-latest
    needs: [engine, container]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meta_supreme
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/meta_supreme
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/meta_supreme_test
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt

      - name: The test fixture's schema and deploy migrations are present
        run: |
          for f in 001_initial_schema 002_workflow_runs 003_schedule_dispatch 004_federated_knowledge_waist 005_agent_runtime_persistence 006_devon_approval_store 007_agent_task_execution_leases 008_agent_effect_receipts 009_agent_hermes_expansion 010_agent_subagent_links 011_passkeys 012_live_state_ledger 013_approval_consumption 014_artifact_body 015_devon_approval_owner 017_provider_usage 018_schema_convergence 019_event_hash_chain 020_episode_transcripts 021_fts_includes_title 022_company_post_drafts 023_company_lead_drafts 024_company_comment_drafts 025_company_findings 026_company_proposals 027_lead_disclosure_optional 028_support_articles 029_runtime_evidence 030_arf_shadow_rate_limit; do
            test -s "database/schemas/$f.sql" || { echo "::error::database/schemas/$f.sql is missing or empty"; exit 1; }
          done
          for f in 005_agent_runtime_persistence 006_devon_approval_store 007_agent_task_execution_leases 008_agent_effect_receipts 009_agent_hermes_expansion 010_agent_subagent_links 011_passkeys 012_live_state_ledger 013_approval_consumption 014_artifact_body 015_devon_approval_owner 017_provider_usage 018_schema_convergence 019_event_hash_chain 020_episode_transcripts 021_fts_includes_title 022_company_post_drafts 023_company_lead_drafts 024_company_comment_drafts 025_company_findings 026_company_proposals 027_lead_disclosure_optional 028_support_articles 029_runtime_evidence 030_arf_shadow_rate_limit; do
            test -s "database/migrations/versions/$f.py" || { echo "::error::database/migrations/versions/$f.py is missing or empty"; exit 1; }
          done

      - name: Full suite (PostgreSQL)
        shell: bash -eo pipefail {0}
        run: python -m pytest -q --tb=short 2>&1 | tee pytest.out

      - name: Fresh Alembic deploy reaches passkey head
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/meta_supreme
        run: |
          alembic upgrade head
          alembic downgrade 004_federated_knowledge_waist
          alembic upgrade head
          python - <<'PY'
          import asyncio
          import asyncpg

          async def main():
              conn = await asyncpg.connect(
                  "postgresql://postgres:postgres@localhost:5432/meta_supreme"
              )
              try:
                  expected = {
                      "arf_shadow_rate_limits",
                      "agent_tasks",
                      "agent_task_runs",
                      "agent_tool_results",
                      "agent_verifications",
                      "agent_skill_revisions",
                      "skill_evaluation_runs",
                      "agent_task_checkpoints",
                      "agent_runtime_memories",
                      "agent_runtime_skills",
                      "devon_approvals",
                      "agent_effect_intents",
                      "agent_effect_receipts",
                      "agent_schedules",
                      "agent_skill_proposals",
                      "agent_subagent_links",
                      "passkey_credentials",
                      "passkey_challenges",
                      "intents",
                      "events",
                      "actions",
                      "approvals",
                      "artifacts",
                      "executors",
                      "systems",
                      "errors",
                      "verifications",
                      "learning_candidates",
                      "universal_receipts",
                      "provider_usage",
                  }
                  rows = await conn.fetch(
                      "SELECT table_name FROM information_schema.tables "
                      "WHERE table_schema = 'public' AND table_name = ANY($1::text[])",
                      list(expected),
                  )
                  present = {row["table_name"] for row in rows}
                  missing = expected - present
                  assert not missing, f"missing migrated tables: {sorted(missing)}"
                  revision = await conn.fetchval("SELECT version_num FROM alembic_version")
                  assert revision == "030_arf_shadow_rate_limit", revision
              finally:
                  await conn.close()

          asyncio.run(main())
          PY

      - name: The Alembic build and the SQL build are the same database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE schema_alembic"
          psql -h localhost -U postgres -c "CREATE DATABASE schema_sql"
          psql -h localhost -U postgres -d schema_alembic -c "CREATE EXTENSION IF NOT EXISTS vector"
          psql -h localhost -U postgres -d schema_sql -c "CREATE EXTENSION IF NOT EXISTS vector"

          DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/schema_alembic \
            alembic upgrade head

          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d schema_sql \
            -f database/schemas/001_initial_schema.sql > /dev/null
          for f in 002_workflow_runs 003_schedule_dispatch 004_federated_knowledge_waist \
                   005_agent_runtime_persistence 006_devon_approval_store \
                   007_agent_task_execution_leases 008_agent_effect_receipts \
                   009_agent_hermes_expansion 010_agent_subagent_links 011_passkeys \
                   012_live_state_ledger 013_approval_consumption 014_artifact_body \
                   015_devon_approval_owner 017_provider_usage 018_schema_convergence 019_event_hash_chain 020_episode_transcripts 021_fts_includes_title 022_company_post_drafts 023_company_lead_drafts 024_company_comment_drafts 025_company_findings 026_company_proposals 027_lead_disclosure_optional 028_support_articles 029_runtime_evidence 030_arf_shadow_rate_limit; do
            psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d schema_sql \
              -f "database/schemas/$f.sql" > /dev/null
          done

          python scripts/schema_shape.py \
            "postgresql://postgres:postgres@localhost:5432/schema_alembic" > shape_alembic.txt
          python scripts/schema_shape.py \
            "postgresql://postgres:postgres@localhost:5432/schema_sql" > shape_sql.txt
          if ! diff -u shape_alembic.txt shape_sql.txt; then
            echo "::error::The Alembic build and the SQL build disagree. Railway deploys the Alembic build; the tests run against the SQL build. Add the missing migration before merging."
            exit 1
          fi
          echo "Both builds agree: $(wc -l < shape_alembic.txt) shape lines."

      - name: Ledger and knowledge suites run against the Alembic build
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/meta_supreme
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/schema_alembic
          TEST_SCHEMA_PREBUILT: "1"
          DEFAULT_AI_PROVIDER: mock
          EMBEDDING_PROVIDER: mock
          ENVIRONMENT: test
        run: |
          python -m pytest -q --tb=short \
            test_live_state_ledger.py \
            test_devon_knowledge_loop_durability.py \
            test_devon_ledger_row_states.py \
            test_knowledge.py \
            test_devon_fkr_query_route.py

      - name: Failure summary
        if: failure()
        run: |
          for f in pytest.out; do
            [ -f "$f" ] || continue
            echo "=== $f (last 40) ==="
            tail -40 "$f"
          done

      - name: Lint
        run: ruff check .
