name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  DEFAULT_AI_PROVIDER: mock
  EMBEDDING_PROVIDER: mock
  ENVIRONMENT: test
  PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/apps/api

jobs:
  standalone:
    name: Standalone offline flagship (canonical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt
      # The whole zero-infrastructure suite, named file by file. This ran only
      # test_billing and test_definition — 12 of the 74 tests that need no
      # database — while nine other files could not even be imported, so CI was
      # green over a suite that mostly did not run.
      # `make standalone` is the documented zero-infrastructure entry point, and
      # nothing imported it, so moving a module out of the flat layout broke it
      # silently. Importing it here is the cheapest way to keep that honest.
      - name: The documented offline entry point still imports
        run: python -c "import standalone_api; print(standalone_api.app.title)"
      - name: Offline suite (no database, no keys)
        run: |
          python -m pytest -q --tb=short \
            test_billing.py \
            test_definition.py \
            test_providers.py \
            test_schedule.py \
            test_workflow_engine.py

  engine:
    name: Engine + cadence (no database)
    runs-on: ubuntu-latest
    needs: standalone
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The declared dependency set, not a hand-picked subset. Naming packages
      # one at a time meant every test added to this job failed first on an
      # import — pydantic-settings, then httpx — rather than on anything the
      # test asserts. requirements.txt is what this code says it needs.
      - run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt
      # These guarded on apps/api/tests, which has never existed in this repo,
      # so the job printed a reassuring message and passed without running a
      # test. A guard whose false branch always wins is not a guard.
      - name: Council and security (no database)
        run: |
          if [ ! -f services/agents/executor.py ]; then
            echo "::error::services/agents/executor.py is absent — it blocks test_council.py and test_phase4_council.py. See RESTORE.md."
            exit 1
          fi
          # The two stream tests drive the endpoint through a real database, so
          # they belong to the `api` job, which provisions one and runs the whole
          # suite. Named individually rather than filtered by keyword: a `-k`
          # pattern would silently widen as tests are added.
          python -m pytest test_council.py test_phase4_council.py test_security.py \
            -q --tb=short \
            --deselect test_phase4_council.py::test_stream_endpoint_emits_events_and_persists \
            --deselect test_phase4_council.py::test_stream_endpoint_reports_errors_as_events

  api:
    name: API suite (PostgreSQL 16 + pgvector)
    runs-on: ubuntu-latest
    needs: engine
    # NOTE: no job-level `if: hashFiles(...)`. hashFiles() is not available in
    # a job-level condition — GitHub rejects the WHOLE FILE at parse time, and
    # the run then reports a failure with zero jobs and no log to read. That is
    # why CI showed "failure" with nothing in it. The requirements check is a
    # step guard below, where the file is actually present to test.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meta_supreme
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/meta_supreme
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/meta_supreme_test
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The root requirements.txt is the one this suite runs on; apps/api's
      # is the older snapshot's. Installing it unconditionally is also what
      # makes the failure visible if it ever goes missing.
      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt

      # The schema files are what conftest.py builds the test database from,
      # and 001 was absent for long enough that every database-backed suite
      # was unrunnable. Fail loudly rather than skip if that recurs.
      - name: The test fixture's schema files are present
        run: |
          for f in 001_initial_schema 002_workflow_runs 003_schedule_dispatch 004_federated_knowledge_waist; do
            test -s "database/schemas/$f.sql" || { echo "::error::database/schemas/$f.sql is missing or empty"; exit 1; }
          done

      # The suite runs BEFORE the migration round-trip, because conftest.py
      # builds its database from database/schemas/*.sql — not from Alembic. The
      # round-trip is an extra check on the migrations, and running it first
      # meant its failure skipped the suite entirely, so the tests this job
      # exists for went unrun three times over.
      # The whole suite, against a real database. This job used to run
      # `apps/api/tests` — a directory that has never existed here — so it
      # passed without executing a single test.
      - name: Full suite (PostgreSQL)
        # pipefail is load bearing. Without it the pipeline reports tee's exit
        # status, so a pytest failure -- including a collection error that runs
        # zero tests -- passes this step silently. Same class as the
        # `ruff check . || true` removed in #5: a gate that cannot fail is an
        # observation, not a gate.
        shell: bash -eo pipefail {0}
        run: python -m pytest -q --tb=short 2>&1 | tee pytest.out

      # The runner appends the whole Postgres service-container log after the
      # steps, and that log echoes the entire init schema — hundreds of lines.
      # Anything a failing step printed is buried above it, unreachable by
      # tailing the job log. Re-printing the summary last is what makes a
      # failure readable at all.
      # Prints whichever step actually produced output. The first version of
      # this only covered pytest.out, so when alembic was the step that failed
      # the summary printed nothing and the real error stayed buried.
      - name: Failure summary
        if: failure()
        run: |
          for f in pytest.out; do
            [ -f "$f" ] || continue
            echo "=== $f (last 40) ==="
            tail -40 "$f"
          done

      # Blocking. This read `ruff check . || true`, which meant the linter could
      # report anything at all and the run still went green — a quality control
      # that cannot fail the build is an observation, not a gate. Turning it on
      # found 17 findings, two of which were real defects: a duplicated
      # `except Exception` in the dispatcher whose second handler was dead code,
      # and a `zip()` in the knowledge ingest that truncated silently when the
      # embedding provider returned fewer vectors than chunks.
      - name: Lint
        run: ruff check .
