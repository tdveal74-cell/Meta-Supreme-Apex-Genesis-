name: Web CI

on:
  pull_request:
    branches: ["main"]
    paths:
      - "apps/web/**"
      - "packages/ui/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/web-ci.yml"
      # check:control's owned-voice ban reads the served consoles under these two
      # roots, and until 2026-09-09 neither triggered this workflow. A pull
      # request restoring the rented voice in deploy/soul/console.html alone kept
      # both copies byte identical, passed all 97 console tests, never ran this
      # job, and would have landed green. The narrow fix is here; the load
      # bearing one is test_devon_owned_voice.py in ci.yml, which has no path
      # filter at all.
      - "deploy/soul/**"
      - "docs/devon/assets/**"
  workflow_dispatch:

jobs:
  web:
    name: Next.js typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install locked workspace
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter @meta-supreme/web typecheck
      - name: Presence protocol checks
        run: pnpm --filter @meta-supreme/web check:presence
      - name: Control plane honesty checks
        run: pnpm --filter @meta-supreme/web check:control
      - name: Production build
        run: pnpm --filter @meta-supreme/web build
