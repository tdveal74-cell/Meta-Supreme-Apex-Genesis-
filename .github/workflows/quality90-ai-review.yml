name: Quality90 AI reviewer
on:
  pull_request:
    paths:
      - 'services/quality90_ai/**'
      - 'n8n/quality90-ai/**'
      - '.github/workflows/quality90-ai-review.yml'
jobs:
  offline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install 'cryptography>=41,<47'
      - name: AI review exact-byte and source-binding tests (no model calls)
        run: python -m unittest discover -s services/quality90_ai -p 'test_*.py' -v
      - name: n8n public-key AI review rejects 89, stale artifacts and forged human authority
        run: node --test n8n/quality90-ai/verify_ai_summary.test.cjs
      - name: Integration transformer parses without touching a workflow
        run: python -m py_compile n8n/quality90-ai/build_review_integration.py
