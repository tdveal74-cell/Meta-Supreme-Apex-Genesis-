[pytest]
asyncio_mode = auto
# One event loop for the whole session so the global async engine's pooled
# connections are never bound to a dead loop.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
# Just the repo root. This read `. ../..` while the file lived at `apps/api/`,
# where `../..` WAS the repo root; flattened here it resolves to the filesystem
# root and puts `/` on sys.path.
pythonpath = .
# No `testpaths`: the suite sits at the repository root, and pointing this at a
# `tests/` directory that does not exist made pytest warn and fall back to a
# recursive scan — which also walked node_modules.
# `.claude` carries the critic worktrees that CLAUDE.md tells every arc to spawn
# with `isolation: "worktree"`. Each one is a second checkout of this same
# repository, so its `test_billing.py` and its `__pycache__` collide with the
# root copies and pytest aborts the whole run with `import file mismatch`
# rather than a test failure. Measured 2026-09-09: one abandoned worktree left
# 33 `__pycache__` directories behind and produced 102 collection errors, which
# reads exactly like the cluster having gone away and is not that.
norecursedirs = node_modules .git __pycache__ dist build apps/web .claude
python_files = test_*.py
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
