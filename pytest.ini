[pytest]
asyncio_mode = auto
# One event loop for the whole session so the global async engine's pooled
# connections are never bound to a dead loop.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
# ../.. puts the repo root on sys.path so `services.*` (the framework-free
# intelligence layer) is importable alongside `app.*`.
pythonpath = . ../..
testpaths = tests
python_files = test_*.py
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
