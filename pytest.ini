[pytest]
asyncio_mode = auto
# One event loop for the whole session so the global async engine's pooled
# connections are never bound to a dead loop.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
# Just the repo root. This read `. ../..` while the file lived at `apps/api/`,
# where `../..` WAS the repo root; flattened here it resolves to the filesystem
# root and puts `/` on sys.path.
pythonpath = .
# No `testpaths`: the suite sits at the repository root, and pointing this at a
# `tests/` directory that does not exist made pytest warn and fall back to a
# recursive scan — which also walked node_modules.
norecursedirs = node_modules .git __pycache__ dist build apps/web
python_files = test_*.py
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
