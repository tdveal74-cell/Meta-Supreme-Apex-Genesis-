# DEVON control plane: production orchestration.
#
#   cp infrastructure/docker/.env.prod.example infrastructure/docker/.env.prod
#   docker compose --env-file infrastructure/docker/.env.prod \
#     -f infrastructure/docker/docker-compose.prod.yml up -d --build
#
# What runs, and what each container is for:
#
#   postgres   The Live State Ledger, the durable Event Bus, and pgvector.
#              If it is not in this database it did not happen.
#   redis      The real-time relay. Presence interrupts and ledger event
#              fan-out to the web will ride pub/sub here; the durable bus stays
#              in Postgres. Provisioned in this build, wired in the next: the
#              API and the presence service read REDIS_URL but neither opens
#              it yet, and that is stated here rather than implied by a
#              running container.
#   api        The FastAPI control plane (Council, ledger, approvals, agent
#              runtime, operator shell). Runs `alembic upgrade head` before it
#              accepts traffic; a failed migration keeps it down on purpose.
#   presence   The streaming middleware: DEVON JWT auth, LiveKit token
#              minting, the WebSocket frame protocol, the sliding window
#              buffer and the inference circuit breaker.
#   web        The Next.js workspace, built once at image build time and
#              served by `next start`. The public API and presence URLs are
#              baked in at build, because NEXT_PUBLIC_* is a build-time value.
#   n8n        The internal executor, under the `executor` profile so it only
#              starts when asked for. Tee's live executor is the VPS instance
#              at n8n.editforge.online; starting a second one against the same
#              credentials would double-fire every scheduled workflow. Use this
#              service for a self-contained stack, never beside the VPS.
#
# Every port binds to 127.0.0.1. A TLS terminator (Caddy, Traefik, the host's
# nginx) fronts this stack; nothing here is meant to face the internet bare.
# Every secret is `${VAR:?}`: compose refuses to start rather than start with
# an empty key. Every image is pinned to a digest-stable tag; bump on purpose.

name: devon-control-plane

x-python-env: &python-env
  ENVIRONMENT: production
  DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/meta_supreme
  REDIS_URL: redis://redis:6379/0
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set, generate one with openssl rand -hex 32}
  CORS_ORIGINS: ${CORS_ORIGINS:-["https://devon.example.invalid"]}
  # Providers default to mock so the stack starts with the keys still blank
  # and /health says "simulated" out loud. Set cerebras (and the key) in
  # .env.prod to go live; a provider named without its key refuses to start
  # and takes the web container down with it, because web waits on health.
  DEFAULT_AI_PROVIDER: ${DEFAULT_AI_PROVIDER:-mock}
  ENRICHMENT_PROVIDER: ${ENRICHMENT_PROVIDER:-mock}
  CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
  CEREBRAS_MODEL: ${CEREBRAS_MODEL:-gpt-oss-120b}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  PROVIDER_DAILY_TOKEN_CAP: ${PROVIDER_DAILY_TOKEN_CAP:-500000}

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: meta_supreme
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the n8n database and the vector extension on first init only.
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meta_supreme"]
      interval: 5s
      timeout: 5s
      retries: 12
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB

  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api
    image: devon-api:local
    restart: unless-stopped
    environment:
      <<: *python-env
      PORT: "8000"
      # Receipt signing keys reach the API only. The presence container holds
      # SECRET_KEY to verify sessions and never sees these, so a compromised
      # presence container cannot forge a Universal Receipt.
      RECEIPT_SIGNING_KEY: ${RECEIPT_SIGNING_KEY:-}
      RECEIPT_SIGNING_KEYS_PREVIOUS: ${RECEIPT_SIGNING_KEYS_PREVIOUS:-}
      DEVON_REGISTRATION_KEY: ${DEVON_REGISTRATION_KEY:-}
      DEVON_SHELL_KEY: ${DEVON_SHELL_KEY:-}
      PASSKEY_RP_ID: ${PASSKEY_RP_ID:?PASSKEY_RP_ID must be the public hostname}
      PASSKEY_RP_NAME: ${PASSKEY_RP_NAME:-DEVON Command Center}
      PASSKEY_ORIGIN: ${PASSKEY_ORIGIN:?PASSKEY_ORIGIN must be the public https origin}
      EDITFORGE_URL: ${EDITFORGE_URL:-}
      EDITFORGE_TOKEN: ${EDITFORGE_TOKEN:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).status == 200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 40s

  presence:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.presence
    image: devon-presence:local
    restart: unless-stopped
    environment:
      <<: *python-env
      PORT: "8010"
      PRESENCE_CORS_ORIGINS: ${CORS_ORIGINS:-["https://devon.example.invalid"]}
      PRESENCE_INFERENCE: ${PRESENCE_INFERENCE:-mock}
      PRESENCE_FALLBACK_INFERENCE: ${PRESENCE_FALLBACK_INFERENCE:-}
      PRESENCE_SPEECH: ${PRESENCE_SPEECH:-mock}
      PRESENCE_TTFT_THRESHOLD_MS: ${PRESENCE_TTFT_THRESHOLD_MS:-500}
      PRESENCE_WINDOW_MS: ${PRESENCE_WINDOW_MS:-250}
      CARTESIA_API_KEY: ${CARTESIA_API_KEY:-}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
    ports:
      - "127.0.0.1:8010:8010"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3).status == 200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s

  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL must be the public API base, ending in /api/v1}
        NEXT_PUBLIC_PRESENCE_URL: ${NEXT_PUBLIC_PRESENCE_URL:?NEXT_PUBLIC_PRESENCE_URL must be the public presence base}
        NEXT_PUBLIC_DEVON_AVATAR_URL: ${NEXT_PUBLIC_DEVON_AVATAR_URL:-}
    image: devon-web:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
      presence:
        condition: service_healthy

  n8n:
    profiles: ["executor"]
    image: n8nio/n8n:2.39.0
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: postgres
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY must be set and never rotated casually, credentials are sealed under it}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: "5678"
      N8N_PROTOCOL: ${N8N_PROTOCOL:-https}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-https://localhost/}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-https://localhost/}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/New_York}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "127.0.0.1:5678:5678"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  n8n_data:
