version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: meta-supreme-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: meta_supreme
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../database/schemas/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meta_supreme"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: meta-supreme-api
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/meta_supreme
      # Required. Compose refuses to start without it; generate one with `openssl rand -hex 32`.
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in the environment, generate one with openssl rand -hex 32}
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
      DEFAULT_AI_PROVIDER: ${DEFAULT_AI_PROVIDER:-mock}
      ENRICHMENT_PROVIDER: ${ENRICHMENT_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      CEREBRAS_MODEL: ${CEREBRAS_MODEL:-gpt-oss-120b}
      PASSKEY_RP_ID: ${PASSKEY_RP_ID:-localhost}
      PASSKEY_RP_NAME: ${PASSKEY_RP_NAME:-DEVON Command Center}
      PASSKEY_ORIGIN: ${PASSKEY_ORIGIN:-http://localhost:3000}
      EDITFORGE_URL: ${EDITFORGE_URL:-http://host.docker.internal:3100}
      EDITFORGE_TOKEN: ${EDITFORGE_TOKEN:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Mount the same canonical source tree the production image copies.
      - ../../app:/app/app
      - ../../services:/app/services
      - ../../database:/app/database
      - ../../docs:/app/docs
      - ../../alembic.ini:/app/alembic.ini:ro
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: meta-supreme-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ../../apps/web:/app/apps/web
      - /app/apps/web/node_modules
      - /app/apps/web/.next
    command: pnpm dev

volumes:
  postgres_data:
