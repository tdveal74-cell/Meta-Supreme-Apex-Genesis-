# Ruff configuration — Meta Supreme Apex Genesis
# Matches the codebase's established style: explicit typing imports are
# accepted (Phase 1 convention); imports are kept sorted; FastAPI's
# Depends-in-default idiom is allowed.

target-version = "py311"
line-length = 100

# Vendored third-party Python. test_vendored_skills.py pins every file there
# to upstream's bytes, so a lint fix cannot be applied locally; upstream fails
# 23 of the rules above (B904, E741, I001 and the like). Fixes go upstream.
extend-exclude = [".claude/skills/watch"]

[lint]
select = ["E", "F", "W", "B", "I"]
ignore = [
    "B008",  # function call in default argument — FastAPI Depends() idiom
    "E501",  # long lines are reviewed by humans, not machines
]

[lint.per-file-ignores]
"apps/api/tests/*" = ["E402"]  # conftest pins env vars before app imports
